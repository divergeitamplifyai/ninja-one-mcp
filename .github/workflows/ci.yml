name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege. Tests never reach the network beyond loopback, so no secrets
# are used and none are granted.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Check (Node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [22, 24]
        include:
          - os: macos-latest
            node: 24
          - os: windows-latest
            node: 24
    steps:
      # Actions are pinned to a full commit SHA; the comment names the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Check (typecheck, drift, tests, conformance, coverage, catalog, bundle)
        run: npm run check

      - name: Bundle starts with plain node
        shell: bash
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            | NINJAONE_ENV_FILE=none node plugins/ninjaone/server/ninja-one-mcp.mjs | grep -q '"serverInfo"'

      - name: No uncommitted drift
        shell: bash
        run: |
          if ! git diff --exit-code --stat; then
            echo "::error::Build or test changed tracked files. Run npm run gen and commit."
            exit 1
          fi

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm audit --omit=dev --audit-level=moderate

  container:
    name: Container image and infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the image
        run: docker build -t ninja-one-mcp:ci .

      - name: Image serves health and refuses unauthenticated MCP
        run: |
          docker run -d --name mcp -p 8080:8080 \
            -e NINJAONE_HTTP_AUTH=bearer \
            -e NINJAONE_HTTP_BEARER_TOKENS=ci-only-token-not-a-secret-0123456789 \
            -e NINJAONE_REGION=us ninja-one-mcp:ci
          for _ in $(seq 1 20); do curl -fsS localhost:8080/healthz && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8080/mcp -H 'content-type: application/json' -d '{}')" = 401
          docker rm -f mcp

      - name: Image refuses to start without inbound auth
        run: |
          if docker run --rm -e NINJAONE_REGION=us ninja-one-mcp:ci; then
            echo "::error::The image started without inbound authentication."
            exit 1
          fi

      - name: Bicep builds without warnings
        run: |
          az bicep install
          az bicep build --file infra/main.bicep --stdout > /dev/null 2> bicep.log || { cat bicep.log; exit 1; }
          if grep -E "Warning|Error" bicep.log; then exit 1; fi

      - name: Shell scripts pass shellcheck
        run: shellcheck infra/scripts/*.sh
