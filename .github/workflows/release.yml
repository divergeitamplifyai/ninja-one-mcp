name: Release

# Builds the Claude Desktop bundle for a version tag and attaches it to the
# GitHub release. Push a tag like v0.1.0 that matches package.json.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - name: Tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: node scripts/pack-mcpb.mjs build/ninja-one-mcp.mcpb
      - name: Publish the container image to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image=ghcr.io/${GITHUB_REPOSITORY,,}
          version=${GITHUB_REF_NAME#v}
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build -t "$image:$version" -t "$image:latest" \
            --label org.opencontainers.image.version="$version" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" .
          docker push "$image:$version"
          docker push "$image:latest"
          docker logout ghcr.io

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk "/^## \[${GITHUB_REF_NAME#v}\]/{f=1;next} /^## \[/{f=0} f" CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" build/ninja-one-mcp.mcpb --title "$GITHUB_REF_NAME" --notes "$notes" --verify-tag
