name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not paste credentials, tenant ids, client names or device names. For security issues, use private vulnerability reporting instead.
  - type: input
    id: tool
    attributes:
      label: Tool
      description: The ninjaone_* tool that misbehaved.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: ninjaone_status_server output
      description: Redact anything identifying. It never contains secret values.
      render: json
  - type: input
    id: client
    attributes:
      label: MCP client and version
      placeholder: Claude Code 2.1, Cursor 2.0, VS Code 1.10x, Codex ...
