name: Feature request
description: A workflow or endpoint you want covered better.
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What are you trying to do?
      description: The question or task, in your own words.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What happens today?
