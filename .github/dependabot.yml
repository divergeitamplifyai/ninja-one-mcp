version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev:
        dependency-type: development
    ignore:
      # engines and .nvmrc stay on Node 22 LTS; the types follow the runtime.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  # Keeps the SHA-pinned actions current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  # Keeps the digest-pinned base images in Dockerfile current, on Node 22 LTS.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']
