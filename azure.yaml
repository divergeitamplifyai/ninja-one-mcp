# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
#
# Azure Developer CLI project for the Azure Container Apps lane (LANES.md,
# docs/deploy-azure.md). `azd up` provisions infra/ and deploys the image built
# from ./Dockerfile. Settings come from the azd environment (azd env set), never
# from this file.
name: ninja-one-mcp
infra:
  provider: bicep
  path: infra
services:
  mcp:
    project: .
    language: docker
    host: containerapp
    docker:
      path: ./Dockerfile
      context: .
      platform: linux/amd64
      remoteBuild: true
