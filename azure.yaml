# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
#
# Azure Developer CLI project: `azd up` provisions infra/ and deploys the
# container built from ./Dockerfile to Azure Container Apps. See docs/AZURE.md.
name: ninja-one-mcp
metadata:
  template: ninja-one-mcp
infra:
  provider: bicep
  path: infra
services:
  mcp:
    project: .
    language: docker
    host: containerapp
    docker:
      path: ./Dockerfile
      context: .
      platform: linux/amd64
      remoteBuild: true
